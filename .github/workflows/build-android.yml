name: Build Nandini Offline Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare-android.mjs
      - scripts/import_openrn.py
      - capacitor.config.json
      - .github/workflows/build-android.yml
      - index.html
      - library.html
      - tutor.html
      - coach.html
      - settings.html
      - topics.html
      - src/**
      - data/books/**
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use hosted runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run study-content tests
        run: npm test
      - name: Prepare full offline Android study assets
        run: node scripts/prepare-android.mjs
      - name: Verify four complete books and personal VPS settings in APK
        run: |
          test -s www/data/books/catalog.json
          test -s www/data/books/fundamentals.json
          test -s www/data/books/skills.json
          test -s www/data/books/terminology.json
          test -s www/data/books/mentalhealth.json
          test -s www/settings.html
          test -s www/src/api-config.js
      - name: Install Capacitor 8
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-mlkit/translation@8 esbuild@0.25.12
      - name: Bundle native offline English-Bengali translation bridge
        run: |
          npx esbuild src/native-translation.js --bundle --format=esm --platform=browser --target=es2022 --outfile=www/src/native-translation.bundle.js
          test -s www/src/native-translation.bundle.js
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile debug APK for personal device testing
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nandini-nursing-study-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
