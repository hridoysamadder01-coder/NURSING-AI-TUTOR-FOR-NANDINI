name: Build Nandini Offline Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare-android.mjs
      - scripts/import_openrn.py
      - capacitor.config.json
      - android-llm/**
      - scripts/add-local-llm.mjs
      - android-signing/**
      - .github/workflows/build-android.yml
      - index.html
      - library.html
      - tutor.html
      - coach.html
      - settings.html
      - topics.html
      - ask.html
      - src/**
      - data/books/**
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use hosted runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run study-content tests
        run: npm test
      - name: Prepare full offline Android study assets
        run: node scripts/prepare-android.mjs
      - name: Verify four complete books and personal VPS settings in APK
        run: |
          test -s www/data/books/catalog.json
          test -s www/data/books/fundamentals.json
          test -s www/data/books/skills.json
          test -s www/data/books/terminology.json
          test -s www/data/books/mentalhealth.json
          test -s www/settings.html
          test -s www/src/api-config.js
      - name: Install Capacitor 8
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-mlkit/translation@8 esbuild@0.25.12
      - name: Bundle native offline English-Bengali translation bridge
        run: |
          npx esbuild src/native-translation.js --bundle --format=esm --platform=browser --target=es2022 --outfile=www/src/native-translation.bundle.js
          test -s www/src/native-translation.bundle.js
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add on-device LLM (llama.cpp + NandiniLlm plugin)
        run: node scripts/add-local-llm.mjs
      - name: Compile debug APK for personal device testing
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify native LLM libraries are packaged for every ARM CPU generation
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/' | tee native-libs.txt
          for lib in libnandini_llm.so libllama.so libggml.so libggml-base.so libc++_shared.so libggml-cpu-android_armv8.0_1.so libggml-cpu-android_armv8.2_1.so; do
            grep -q "lib/arm64-v8a/$lib" native-libs.txt || { echo "missing $lib"; exit 1; }
          done
      - name: Verify the APK is signed with the fixed key (so updates install over the old app)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee signer.txt
          grep -qi 'SHA-256 digest: f7e1b16c422ba0b5c0c0ca965e1970798ce6ac4f4da6fbb21632bc9f9f940a1a' signer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nandini-nursing-study-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
