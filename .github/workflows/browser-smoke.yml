name: Mobile Browser User Journey
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/browser-smoke.mjs
      - .github/workflows/browser-smoke.yml
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chrome driver
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Test real mobile browser navigation, notes, source search and chapter reader
        env:
          NODE_ENV: test
        run: node scripts/browser-smoke.mjs
